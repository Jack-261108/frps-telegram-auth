# Telegram Bot 配置
bot_token: "YOUR_TELEGRAM_BOT_TOKEN" # 从 @BotFather 获取的 Token
admin_chat_id: 123456789             # 您的 Telegram User ID (可通过对机器人发送 /start 获取)
telegram_proxy: "socks5://127.0.0.1:40000" # 推荐使用服务器本地的 Cloudflare WARP 代理，稳定且高可用；若留空会自动检测 40000 端口

# 本地服务监听配置
listen_host: "127.0.0.1"
listen_port: 8765

# 需要拦截审批的代理列表（包含关键字即可拦截，留空则拦截所有代理）
protected_proxies:
  - "phone-ssh"
  - "phone"

# 审批等待超时时间（秒），默认 300 秒 (5 分钟)，超时自动拦截
approval_timeout: 300

# 临时白名单有效时长（秒），例如点击 "放行30分钟" 后的免审批时长
whitelist_duration: 1800

# 封禁黑名单时长（秒），点击 "封禁此 IP 24小时" 后的静默拦截时长，默认 86400 秒 (24小时)
ban_duration: 86400

# 审批超时后是否自动删除卡片消息（true 为自动销毁不留痕迹，false 为编辑保留为超时文本）
auto_delete_timeout: true

# 自动更新配置（若使用 GitHub Actions 自动部署，可保持 false）
auto_update:
  enabled: false          # 是否启用内部定时轮询检查（GitHub Actions 模式下建议 false）
  interval_seconds: 300   # 检查间隔（秒）
  branch: "main"          # 监听分支
