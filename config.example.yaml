# Telegram Bot 配置
bot_token: "YOUR_TELEGRAM_BOT_TOKEN" # 从 @BotFather 获取的 Token
admin_chat_id: 123456789             # 您的 Telegram User ID (可通过对机器人发送 /start 获取)
telegram_proxy: "http://127.0.0.1:7890" # 可选，国内服务器若无法直连 TG API 可配置本地代理，若无需代理可留空或注释

# 本地服务监听配置
listen_host: "127.0.0.1"
listen_port: 8765

# 需要拦截审批的代理列表（包含关键字即可拦截，留空则拦截所有代理）
protected_proxies:
  - "phone-ssh"
  - "phone"

# 审批等待超时时间（秒），超时自动拒绝
approval_timeout: 30

# 临时白名单有效时长（秒），例如点击 "放行30分钟" 后的免审批时长
whitelist_duration: 1800

# 自动更新配置（若使用 GitHub Actions 自动部署，可保持 false）
auto_update:
  enabled: false          # 是否启用内部定时轮询检查（GitHub Actions 模式下建议 false）
  interval_seconds: 300   # 检查间隔（秒）
  branch: "main"          # 监听分支
